[package]
name = "texnap-core"
version = "0.7.0"
description = "texnap's Tauri-free OCR engine: providers, transcription, verification, key resolution."
authors = ["Elyo"]
edition = "2021"

[lib]
name = "texnap_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# Offline local OCR (F6), behind the `local` feature so the CLI stays light and
# only the desktop app pulls onnxruntime + the model runtime. Enable with
# `texnap-core = { ..., features = ["local"] }`.
ort = { version = "=2.0.0-rc.13", features = ["half"], optional = true }
tokenizers = { version = "0.20", default-features = false, features = ["onig"], optional = true }
image = { version = "0.25", optional = true }
half = { version = "2", optional = true }

# F6b: on-device LLM for offline plain-language explanation (Qwen2.5-1.5B GGUF
# via candle). Explanation-only on the local provider; naming stays cloud-only.
# Metal acceleration is enabled by the app through the `metal` feature below.
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }

[features]
local = ["dep:ort", "dep:tokenizers", "dep:image", "dep:half"]
# Opt-in on-device explanation LLM (candle). Deliberately NOT part of `local`,
# so the default/release build stays lean (no candle). Quality at 1.5B is weak
# for now — kept behind this flag to finish later. Needs `metal` for speed.
local_llm = ["local", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
# Metal/Accelerate for the on-device LLM. candle links the system frameworks —
# no dylib. Enabled by the app alongside local_llm.
metal = ["candle-core?/metal", "candle-nn?/metal", "candle-transformers?/metal", "candle-core?/accelerate", "candle-nn?/accelerate"]
