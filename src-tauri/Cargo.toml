[package]
name = "texnap"
version = "0.5.0"
description = "A Tauri App"
authors = ["Elyo"]
edition = "2021"

# This manifest is both the Tauri app package AND the Cargo workspace root, so
# the app stays exactly where Tauri expects it (src-tauri/) while the shared
# engine (core/) and the terminal tool (cli/) live beside it as members. The
# app depends on core; the CLI depends on core only (no Tauri) — see
# Trinity/TEXNAP/ROADMAP.md § Session CLI.
[workspace]
members = ["core", "cli"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "texnap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
# The OCR engine (providers, transcription, key-resolution rules) lives here,
# shared with the CLI.
texnap-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dotenvy = "0.15"

# F6 offline OCR downloader deps — only pulled with the `local` feature.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
sha2 = { version = "0.10", optional = true }
futures-util = { version = "0.3", optional = true }

# The F6 `local` feature (offline on-device OCR) links onnxruntime. `ort`'s
# `download-binaries` links it STATICALLY into the binary on macOS (verified:
# `otool -L` shows no libonnxruntime.dylib, 30k+ onnxruntime symbols are baked
# in), so there is nothing to bundle — the feature ships safely. It is ON by
# default so `npm run tauri build` includes local OCR in the `.dmg`; build a lean
# variant with `--no-default-features` if ever needed.
[features]
default = ["local"]
local = ["texnap-core/local", "dep:reqwest", "dep:sha2", "dep:futures-util"]
# Opt-in offline explanation LLM (candle + Metal). Off by default so releases
# stay lean; enable to build the on-device explanation (deferred — weak at 1.5B).
local_llm = ["local", "texnap-core/local_llm", "texnap-core/metal"]


# Only the eval runner (examples/eval.rs) needs its own async runtime — the
# app itself gets one from Tauri.
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
